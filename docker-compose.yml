services:
  grimoire:
    build: .
    image: grimoire:local
    container_name: grimoire
    mem_limit: 28g
    memswap_limit: 28g
    oom_score_adj: 500
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - ${MODELS_DIR}:/models
      - ${TEMPLATES_DIR}:/templates:ro
      - ${GRAMMARS_DIR}:/etc/grimoire/grammars:ro
      - ${TOKEN_STATS_PATH}:/var/lib/grimoire/token-stats.json:ro
      - ./state:/var/lib/grimoire
      - ${MODELS_JSON_PATH}:/etc/grimoire/models.json:ro
      # Dev override: bind-mount Python source so code changes apply immediately.
      - ${DEV_SRC_BIND}:/opt/grimoire-venv/lib/python3.11/site-packages/grimoire:ro
      # Host-built webui — shadows the image's COPY --from=webui.
      - ./webui/build:/opt/grimoire-webui:ro
      # FIXME: restore when atomic/llama-server binary is available
      #- /home/yeowool/grimoire/atomic/llama-server:/opt/grimoire-llama-cpp/bin/llama-server:ro
      - /home/yeowool/grimoire/atomic:/opt/atomic:ro
      - /sys/devices/virtual/powercap:/host-powercap:ro
      - type: tmpfs
        target: /dev/shm/grimoire-snapshots
        tmpfs:
          size: 21474836480
      - type: tmpfs
        target: /dev/shm/grimoire-slots
        tmpfs:
          size: 10737418240
          mode: 1777
    environment:
      - GRIMOIRE_API_KEY=${GRIMOIRE_API_KEY}
      # Browser origins allowed to call /stats cross-site (dash.lost.plus).
      - GRIMOIRE_CORS_ORIGINS=${GRIMOIRE_CORS_ORIGINS:-}
      # Prunes raw 5s samples only; the per-minute rollup is never pruned, so
      # lifetime graphs survive. 0 keeps everything.
      - GRIMOIRE_TELEMETRY_RETENTION_DAYS=${GRIMOIRE_TELEMETRY_RETENTION_DAYS:-0}
      - TURBO_AUTO_ASYMMETRIC=0
      - STRUCTURED_COT=0
      - STRUCTURED_TOOL=0
      - STRUCTURED_TOOL_FALLBACK=0
      - TOOL_STRUCTURED_PLAN_TIMEOUT_S=8
      - TOOL_STRUCTURED_PLAN_MAX_TOKENS=192
      - LLAMA_ARG_CACHE_RAM=4096
      - LD_LIBRARY_PATH=/opt/atomic:/opt/grimoire-llama-cpp/lib:/opt/grimoire-llama-cpp/lib64
      - GRIMOIRE_TURBOQUANT_LIB_DIR=/opt/atomic
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The dashboard, lifted out of the chat webui into its own site. Static files
  # only — it reads everything from the gateway's /stats endpoints in the
  # browser, so it holds no state and can restart freely. See dash/README.md.
  dash:
    build:
      context: ./dash
    image: grimoire-dash:local
    container_name: grimoire-dash
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "9002:80"
    environment:
      # nginx attaches this to /stats on the way through, so the browser never
      # holds a credential and there is no sign-in step. It also means anyone
      # who can reach this site can read the figures — whatever guards the site
      # is what guards the data.
      - GRIMOIRE_API_KEY=${GRIMOIRE_API_KEY}
      - GRIMOIRE_GATEWAY_URL=http://grimoire:9001
    depends_on:
      - grimoire
