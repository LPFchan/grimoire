# nginx does not merge add_header across levels: a block that sets any header
# discards every one inherited from its parent. So these are included into each
# location rather than declared once on the server.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
