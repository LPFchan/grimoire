server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# The dashboard shows private usage and cost figures. Keep it out of indexes
	# and out of referrer headers on any outbound link.
	add_header X-Robots-Tag "noindex, nofollow" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Vite fingerprints these, so they can be cached hard.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		try_files $uri =404;
	}

	# Single page app: everything else resolves to the shell, which must never
	# be cached or a deploy leaves stale asset URLs behind.
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri /index.html;
	}
}
